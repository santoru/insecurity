---
layout: default
---

<!-- Page Header (keeps .intro-header for the navbar script) -->
<header class="intro-header brand-header">
    <div class="measure header-inner">
        {% if page.kicker %}<span class="label header-kicker">{{ page.kicker }}</span>{% endif %}
        <h1>{{ page.title | default: site.title }}</h1>
        <p class="header-lead">{{ page.description | default: site.description }}</p>
    </div>
</header>

<!-- Main Content -->
<main class="page">
    <article class="measure page-body">
        {{ content }}
    </article>
</main>
